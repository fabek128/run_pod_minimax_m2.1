services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: "${OPENAI_API_BASE_URL:-https://YOUR-RUNPOD-ENDPOINT/v1}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-local-key}"
      DEFAULT_MODELS: "${DEFAULT_MODELS:-MiniMaxAI/MiniMax-M2.1}"
    volumes:
      - openwebui-data:/app/backend/data

volumes:
  openwebui-data:
